<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projeto Plataforma Fiorella</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<!-- Login Fiorella: supabase-js + guard da Central de Acesso (chave "projeto-fiorella"). Não editar. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://textilegroup.github.io/fiorella-login/guard.js" data-app="projeto-fiorella" data-tema="nao"></script>
<!-- Fiorella UI — identidade visual centralizada -->
<script src="https://textilegroup.github.io/fiorella-ui/fiorella-ui.js" defer></script>
<style>
/* =====================================================================
   PROJETO PLATAFORMA CORPORATIVA FIORELLA
   ---------------------------------------------------------------------
   Visual: Fiorella UI (tokens --fi-*). Login: Central de Acesso Fiorella.
   Dados: documento único compartilhado no Supabase (proj_fiorella),
   com versão (uma edição não sobrescreve a outra) e histórico.
   Permissões (definidas na Central, ferramenta "projeto-fiorella"):
     ver    -> somente leitura
     editar -> edita todo o conteúdo do projeto
     admin  -> edita o conteúdo e também a guia ADM (participantes,
               áreas, tipos/funções, listas de opções e dados)
   Menu separado em duas famílias:
     ACOMPANHAMENTO (vermelho)  -> execução do projeto
     SOBRE O PROJETO (azul)     -> material explicativo
   ===================================================================== */
:root{--exec:var(--fi-brand,#b5121b);--doc:var(--fi-info,#1f5f8b)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--fi-bg,#f4f6f8);color:var(--fi-text,#20242a);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45}
.muted{color:var(--fi-muted)}
h1,h2,h3,h4,p{margin:0}

/* Cabeçalho: o topo rola; o menu de guias fica fixo */
.fi-topbar{position:relative!important;flex-wrap:wrap;row-gap:8px;padding-top:8px;padding-bottom:8px}
.proj-name{display:flex;flex-direction:column;border-left:1px solid var(--fi-line);padding-left:18px;min-width:0}
.proj-name b{font-size:.95rem;font-weight:750;letter-spacing:-.01em}
.proj-name small{color:var(--fi-muted);font-size:.72rem}
.sync{font-size:.72rem;color:var(--fi-muted);white-space:nowrap;align-self:center}
.sync.erro{color:var(--fi-danger);cursor:pointer;font-weight:700}
.sync.salvando{color:var(--fi-warning)}
.btn-edit.on{background:var(--exec);border-color:var(--exec);color:#fff}
@media(max-width:700px){.proj-name{display:none}.fi-topbar__actions{margin-left:0!important;width:100%;flex-wrap:wrap;justify-content:flex-end}.sync{margin-right:auto}.fi-user__nivel{display:none}}
.btn-edit{white-space:nowrap}

/* ===== Menu por famílias ===== */
.menu{position:sticky;top:0;z-index:45;background:var(--fi-surface);border-bottom:1px solid var(--fi-line);box-shadow:0 2px 10px rgba(28,37,46,.05)}
.menu-in{max-width:1540px;margin:0 auto;padding:0 28px;display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none}
.menu-in::-webkit-scrollbar{display:none}
.fam{display:flex;align-items:stretch;gap:2px;padding-right:12px;margin-right:12px;border-right:1px solid var(--fi-line);flex:none}
.fam-exec{--fam:var(--exec)} .fam-doc{--fam:var(--doc)} .fam-adm{--fam:var(--fi-muted);margin-left:auto;border-right:0;margin-right:0;padding-right:0}
.fam-l{align-self:center;display:inline-flex;align-items:center;gap:6px;margin-right:6px;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--fam) 11%,transparent);color:var(--fam);font-size:.66rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.fam-l svg,.tab svg{width:14px;height:14px;flex:none}
.tab{display:flex;align-items:center;gap:6px;padding:14px 12px 11px;border-bottom:3px solid transparent;color:var(--fi-muted);text-decoration:none;font-size:.84rem;font-weight:650;white-space:nowrap}
.tab:hover{color:var(--fi-text)}
.tab.on{color:var(--fam);border-bottom-color:var(--fam)}
@media(max-width:700px){.menu-in{padding:0 12px}}

.edit-bar{background:color-mix(in srgb,var(--exec) 9%,var(--fi-surface));border-bottom:1px solid color-mix(in srgb,var(--exec) 25%,transparent);font-size:.78rem;color:var(--fi-text)}
.edit-bar .in{max-width:1540px;margin:0 auto;padding:7px 28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ===== Página ===== */
.fam-ink-exec{--fam:var(--exec)} .fam-ink-doc{--fam:var(--doc)} .fam-ink-adm{--fam:var(--fi-muted)}
.fi-page-head .fi-eyebrow{color:var(--fam)}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--fi-muted)}
.sec::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--fam,var(--exec));flex:none}
.sec .count{font-weight:600;letter-spacing:0;text-transform:none}
.sec .right{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;display:flex;gap:8px;align-items:center}
.gauto{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
@media(max-width:700px){.gauto{grid-template-columns:1fr}}
.card-pad{padding:16px 18px}
button.fi-metric{text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
button.fi-metric:hover{border-color:var(--fi-line-strong)}

/* ===== Edição estilo planilha ===== */
.et{white-space:pre-wrap;overflow-wrap:anywhere}
.et:empty::before{content:attr(data-ph);color:var(--fi-muted);font-style:italic;font-weight:400}
body.editing .et[contenteditable]{outline:1px dashed color-mix(in srgb,var(--exec) 40%,transparent);outline-offset:1px;border-radius:3px;cursor:text;min-width:24px;display:inline-block;max-width:100%}
body.editing div.et[contenteditable],body.editing p.et[contenteditable],body.editing h1.et[contenteditable],body.editing h3.et[contenteditable]{display:block}
body.editing .et[contenteditable]:hover{background:color-mix(in srgb,var(--exec) 5%,transparent)}
body.editing .et[contenteditable]:focus{outline:2px solid var(--exec);background:var(--fi-surface)}
.es{font:inherit;font-size:.76rem;border:1px solid var(--fi-line);border-radius:6px;padding:3px 6px;background:var(--fi-surface);color:var(--fi-text);max-width:100%}
.ppl{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px}
.pw{display:inline-flex;align-items:center}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--fi-line);background:var(--fi-surface);border-radius:999px;padding:2px 10px 2px 2px;font:inherit;font-size:.76rem;font-weight:650;cursor:pointer;color:var(--fi-text)}
.pchip:hover{border-color:var(--exec)}
.pchip.off{opacity:.55;text-decoration:line-through}
.av{width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,var(--exec) 12%,transparent);color:var(--exec);display:grid;place-items:center;font-size:.62rem;font-weight:800;flex:none}
.av.lg{width:42px;height:42px;font-size:.85rem}
.tchip{display:inline-block;border:1px dashed var(--fi-line-strong);border-radius:999px;padding:2px 10px;font-size:.76rem;color:var(--fi-muted)}
.x{border:0;background:none;color:var(--fi-muted);cursor:pointer;font-size:15px;line-height:1;padding:0 3px 0 2px}
.x:hover{color:var(--fi-danger)}
.padd{border:1px dashed var(--exec);background:none;color:var(--exec);border-radius:999px;width:24px;height:24px;cursor:pointer;font-weight:800;line-height:1}
.rm{border:1px solid transparent;background:none;border-radius:6px;padding:3px 7px;cursor:pointer;color:var(--fi-muted);font-size:13px}
.rm:hover{color:var(--fi-danger);border-color:var(--fi-line)}
.add-row{margin-top:10px}

/* Tabelas-planilha */
.fi-table td{vertical-align:top}
.sheet td,.sheet th{white-space:normal}
.sheet td{min-width:110px}
.sheet td.wide{min-width:220px}
.sheet td.nw{white-space:nowrap;min-width:0}

/* Visão geral */
.hero{padding:22px 24px;border-left:4px solid var(--doc)}
.hero .lbl{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--doc)}
.hero h2{font-size:1.25rem;font-weight:800;margin:6px 0 8px}
.hero p{color:var(--fi-muted);font-size:.95rem;max-width:960px}
.layers{display:grid;gap:8px}
.layer{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center;padding:14px 18px;border-radius:var(--fi-radius);border:1px solid var(--fi-line);background:var(--fi-surface)}
.layer .ln{font-weight:800}
.layer .ls{display:block;font-size:.66rem;font-weight:700;color:var(--fi-muted);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.layer.l-ia{border-style:dashed;background:var(--fi-surface-alt)}
.layer.l-plataforma{border-color:color-mix(in srgb,var(--exec) 40%,var(--fi-line));background:color-mix(in srgb,var(--exec) 5%,var(--fi-surface))}
.layer.l-plataforma .ln{color:var(--exec)}
.layer-arrow{text-align:center;color:var(--fi-muted);font-size:.72rem;font-weight:600}
@media(max-width:700px){.layer{grid-template-columns:1fr;gap:4px}}
.num{width:24px;height:24px;border-radius:6px;background:color-mix(in srgb,var(--fam) 12%,transparent);color:var(--fam);display:inline-grid;place-items:center;font-size:.72rem;font-weight:800;flex:none}
.phases{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.phases.seq{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:22px}
.phases.seq .phase{position:relative}
.phases.seq .phase:not(:last-child)::after{content:"";position:absolute;right:-16px;top:22px;width:9px;height:9px;border-top:2px solid var(--doc);border-right:2px solid var(--doc);transform:rotate(45deg)}
.vinc{margin:8px 0 2px}
.vchip{display:inline-flex;align-items:center;border:1px solid color-mix(in srgb,var(--exec) 35%,var(--fi-line,#dfe3e8));background:color-mix(in srgb,var(--exec) 6%,var(--fi-surface,#fff));color:var(--fi-text);border-radius:6px;padding:2px 9px;font:inherit;font-size:.76rem;font-weight:650;cursor:pointer}
.vchip:hover{border-color:var(--exec)}
.vfalta{font-size:.76rem;color:var(--fi-warning,#a16207)!important;font-weight:600}
.vbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 12px;max-height:180px;overflow:auto;border:1px solid var(--fi-line,#dfe3e8);border-radius:7px;padding:8px 10px;font-size:.84rem;margin-bottom:6px}
.vbox label{display:flex;gap:6px;align-items:center;cursor:pointer}
.ficha .fi-field{display:flex;flex-direction:column;gap:4px}
.ficha .fi-field.erro .fi-input,.ficha .fi-field.erro .vbox,.ficha .fi-field.erro .fi-select{border-color:var(--fi-danger,#c0122c);box-shadow:0 0 0 2px color-mix(in srgb,var(--fi-danger,#c0122c) 18%,transparent)}
.req{color:var(--fi-danger,#c0122c)}
dialog .m-body{max-height:calc(100vh - 170px)}
.passos .et{display:block;white-space:pre-wrap;color:var(--fi-text)}
/* Coluna Nome (ADM → Participantes): não quebrar o nome letra a letra */
.sheet td.ncol{min-width:170px}
.sheet td.ecol{min-width:190px}
.nome-cel{display:inline-flex;align-items:center;gap:8px;flex-wrap:nowrap}
.nome-cel .av{flex:none}
.nome-cel b,.nome-cel .et{white-space:nowrap;overflow-wrap:normal;word-break:normal}
.sheet td.nw .et{overflow-wrap:normal;word-break:normal}
.et[data-p$=".nome"][data-p^="modulos."],.et[data-p$=".nome"][data-p^="processos."],.et[data-p$=".nome"][data-p^="sistemas."],input.up{text-transform:uppercase}
input.up::placeholder{text-transform:none}
.nenhum{display:flex;gap:6px;align-items:center;font-size:.84rem;margin-top:4px;cursor:pointer}
.etapa-ctl{margin-top:8px;display:grid;gap:6px}
.ped{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--fi-warning,#a16207) 10%,var(--fi-surface,#fff));border:1px solid color-mix(in srgb,var(--fi-warning,#a16207) 35%,transparent);border-radius:7px;padding:6px 9px;font-size:.76rem}
.ped-bt{display:flex;flex-wrap:wrap;gap:6px}
.bt-s{min-height:26px!important;padding:2px 10px!important;font-size:.74rem!important}
.hist{font-size:.7rem}
.anterior{margin:8px 0 0;border:1px dashed var(--fi-line,#dfe3e8);border-radius:7px;padding:6px 10px;font-size:.78rem}
.anterior summary{cursor:pointer;color:var(--fi-muted);font-weight:650}
.anterior .kv{margin-top:8px}
.proc .anterior{margin:0 18px 12px}
.bcard .etapa-ctl{margin-top:6px}.bcard .ped{flex-direction:column;align-items:flex-start}
.resumo{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;font-size:.8rem;color:var(--fi-muted);padding:6px 2px 10px;border-bottom:1px solid var(--fi-line,#dfe3e8);margin-bottom:14px}
.resumo b{color:var(--fi-text)}
.resumo a{color:var(--fi-muted);text-decoration:none;cursor:pointer}
.resumo a:hover{color:var(--exec);text-decoration:underline}
.resumo a.alerta,.resumo a.alerta b{color:var(--exec);font-weight:700}
.tab-badge{margin-left:6px;background:var(--exec);color:#fff;border-radius:999px;padding:0 6px;font-size:.66rem;line-height:1.5;font-weight:800}
.rchip{border-style:dashed}
.notas{margin-top:10px;border-top:1px solid var(--fi-line,#dfe3e8);padding-top:8px;display:grid;gap:6px}
.notas .count{margin-left:4px;opacity:.7}
.nl-tag{margin-left:6px;background:color-mix(in srgb,var(--exec) 14%,transparent);color:var(--exec);border-radius:999px;padding:0 7px;font-size:.66rem;font-weight:800;text-transform:none;letter-spacing:0}
.nota{border-left:3px solid var(--fi-line,#dfe3e8);padding:3px 8px;border-radius:0 6px 6px 0;font-size:.8rem;background:var(--fi-surface-alt,#f6f7f9)}
.nota.nova{border-left-color:var(--exec)}
.nota.sis{font-style:italic}
.nota.pisca{outline:2px solid var(--exec);outline-offset:2px}
.nh,.upd-h{display:flex;align-items:center;gap:6px;font-size:.72rem;flex-wrap:wrap}
.nmark{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:color-mix(in srgb,var(--exec) 14%,transparent);color:var(--exec);font-size:.58rem;font-weight:800;flex:none}
.nt{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.men{color:var(--doc);font-weight:700}
.nform{display:grid;gap:6px}
.nform textarea{width:100%;font:inherit;font-size:.82rem;resize:vertical}
.nform-bt{display:flex;gap:6px;justify-content:space-between;align-items:center}
.nmen{max-width:170px;font-size:.76rem;min-height:26px;padding:2px 6px}
.linkbtn{border:0;background:none;color:var(--exec);font:inherit;font-size:.74rem;font-weight:650;cursor:pointer;padding:0;justify-self:start}
.proc-notas{padding:0 18px 14px}
.upd-list{display:grid;gap:8px}
.upd{padding:10px 14px;border-left:4px solid transparent}
.upd.nova{border-left-color:var(--exec)}
.upd-f{margin-top:6px}
/* Campo de anotação em destaque (claro e escuro) */
.nform textarea{background:color-mix(in srgb,var(--doc) 8%,var(--fi-surface,#fff))!important;border:1.5px solid color-mix(in srgb,var(--doc) 45%,var(--fi-line,#dfe3e8))!important;color:var(--fi-text)!important;border-radius:8px}
.nform textarea::placeholder{color:color-mix(in srgb,var(--doc) 70%,var(--fi-muted,#6b7280))}
.nform textarea:focus{outline:none;border-color:var(--doc)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--doc) 22%,transparent)}
/* Processo com a mesma largura do módulo */
.gauto .proc .raci{grid-template-columns:repeat(2,minmax(0,1fr))}
.gauto .proc .raci>div{border-right:0}
.gauto .proc .raci>div:nth-child(odd){border-right:1px solid var(--fi-line)}
.gauto .proc .proc-bottom{grid-template-columns:repeat(2,minmax(0,1fr))}
/* Página inteira */
.bt-cheio{border:1px solid var(--fi-line,#dfe3e8);background:var(--fi-surface,#fff);color:var(--fi-muted);border-radius:6px;width:28px;height:28px;font-size:15px;line-height:1;cursor:pointer;flex:none}
.bt-cheio:hover{color:var(--exec);border-color:var(--exec)}
.cheio-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.cheio{display:block;max-width:1150px}
.cheio>.fi-card{margin:0}
.cheio .item h3,.cheio .proc-top h3{font-size:1.25rem}
/* Ícone de bate-papo acima de "Atualizações" */
.tab.tab-upd{flex-direction:column;gap:1px;padding-top:4px;padding-bottom:7px;justify-content:flex-end}
.chat{display:inline-flex;align-items:center;gap:3px;line-height:1}
.chat svg{width:15px;height:15px}
.bal{display:inline-block;min-width:16px;padding:1px 5px;border-radius:999px;font-size:.6rem;font-weight:800;text-align:center;color:#fff;border:1px solid transparent}
.bal.novas{background:#d6182f}
.bal.mencoes{background:#1f5f8b}
.bal.off{background:var(--fi-surface,#fff);color:var(--fi-text,#111);border-color:var(--fi-text,#111);filter:grayscale(1)}
.cond{display:inline-block;padding:2px 8px;border-radius:5px;font-size:.7rem;font-weight:800;border:1px solid}
.cond-pausado{color:#a16207;border-color:#a16207;background:color-mix(in srgb,#a16207 10%,transparent)}
.cond-bloqueado{color:#c2410c;border-color:#c2410c;background:color-mix(in srgb,#c2410c 10%,transparent)}
.cond-cancelado{color:var(--fi-muted);border-color:var(--fi-muted);text-decoration:line-through}
.tr-nomes{display:flex;flex-wrap:wrap;align-items:center;gap:1px 4px;margin-top:5px;font-size:.64rem;line-height:1.35;color:var(--fi-muted)}
.tr-nomes b{font-weight:700;white-space:nowrap}
.tr-nomes b.feito{color:color-mix(in srgb,var(--exec) 60%,var(--fi-muted,#6b7280))}
.tr-nomes b.atual{color:var(--exec);font-weight:800;text-decoration:underline;text-underline-offset:2px}
.tr-nomes .sep{opacity:.5}
.upd-tabs{display:flex;gap:0;border-bottom:2px solid var(--fi-line,#dfe3e8);margin:0 0 14px}
.upd-tabs button{border:0;background:none;font:inherit;font-size:.9rem;font-weight:750;color:var(--fi-muted);padding:9px 16px;margin-bottom:-2px;border-bottom:3px solid transparent;cursor:pointer}
.upd-tabs button.on{color:var(--exec);border-bottom-color:var(--exec)}
.upd-tabs b{margin-left:6px;font-size:.7rem;background:var(--fi-surface-alt,#eef0f3);color:var(--fi-text);border-radius:999px;padding:1px 7px}
.upd-tabs b.tem{background:#d6182f;color:#fff}
.aprov-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));margin-bottom:8px}
.aprov{padding:12px 14px;display:grid;gap:6px;border-left:4px solid var(--fi-warning,#a16207)}
.aprov-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.aprov-m{font-size:.86rem}
.trilha-w{margin:10px 0 2px}.trilha-w .k b{color:var(--exec)}
.trilha{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.tr-s{display:flex;flex-direction:column;gap:3px;min-width:0}
.tr-s::before{content:"";height:6px;border-radius:3px;background:var(--fi-line,#dfe3e8)}
.tr-s b{font-size:.62rem;font-weight:600;color:var(--fi-muted);text-align:center}
.tr-s.feito::before{background:color-mix(in srgb,var(--exec) 45%,#dfe3e8)}
.tr-s.atual::before{background:var(--exec)}
.tr-s.atual b{color:var(--exec);font-weight:800}
.phase{padding:14px;display:flex;flex-direction:column;gap:6px}
.phase .n{font-size:1.5rem;font-weight:800;color:var(--doc);line-height:1}
.phase h4{font-size:.9rem}
.phase p{font-size:.78rem;color:var(--fi-muted)}
.card-top{display:flex;gap:8px;align-items:flex-start}
.card-top .grow{flex:1;min-width:0}

/* Pessoas */
.person{padding:16px;display:flex;flex-direction:column;gap:10px}
.person-head{display:flex;gap:12px;align-items:center}
.person-head h3{font-size:.95rem}
.person .cargo{font-size:.78rem;color:var(--fi-muted);margin-top:2px}
.person .resp{font-size:.82rem;color:var(--fi-muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.foot{border-top:1px solid var(--fi-line);padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.76rem;color:var(--fi-muted)}
.group-label{font-size:.8rem;font-weight:700;color:var(--fi-muted);margin:18px 0 10px}
.tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:.7rem;font-weight:600;background:var(--fi-surface-alt);border:1px solid var(--fi-line);color:var(--fi-muted);white-space:nowrap}

/* Itens (módulos, sistemas, ideias) */
.item{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.item h3{font-size:.95rem;font-weight:700}
.item .sub{font-size:.74rem;color:var(--fi-muted);margin-top:3px}
.item p,.item .txt{font-size:.82rem;color:var(--fi-muted)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.kv>div{min-width:0}
.k{font-size:.64rem;text-transform:uppercase;letter-spacing:.07em;color:var(--fi-muted);font-weight:700;margin-bottom:4px}
.kv .full{grid-column:1/-1}
.next{background:var(--fi-surface-alt);border-left:3px solid var(--exec);padding:8px 10px;border-radius:0 6px 6px 0;font-size:.82rem}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* Processos */
.proc{overflow:hidden}
.proc-top{padding:14px 18px 12px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--fi-line)}
.proc-top h3{font-size:.95rem}
.proc-top .sub{margin-top:6px}
.raci{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.raci>div{padding:10px 18px;border-bottom:1px solid var(--fi-line);min-width:0}
.raci>div:not(:nth-child(3n)){border-right:1px solid var(--fi-line)}
.raci .k{display:flex;align-items:center;gap:5px}
.raci .k i,.legend i{font-style:normal;width:16px;height:16px;border-radius:4px;background:color-mix(in srgb,var(--exec) 12%,transparent);color:var(--exec);display:grid;place-items:center;font-size:.6rem;font-weight:800}
@media(max-width:700px){.raci{grid-template-columns:repeat(2,minmax(0,1fr))}.raci>div{border-right:0!important}.raci>div:nth-child(odd){border-right:1px solid var(--fi-line)!important}}
.proc-bottom{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px 18px;background:var(--fi-surface-alt);font-size:.8rem}
@media(max-width:700px){.proc-bottom{grid-template-columns:1fr}}
.proc-obs{padding:10px 18px;font-size:.78rem;color:var(--fi-muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--fi-muted);margin-bottom:14px}
.legend span{display:inline-flex;gap:5px;align-items:center}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subnav button{border:1px solid var(--fi-line);background:var(--fi-surface);border-radius:999px;padding:5px 12px;font:inherit;font-size:.76rem;font-weight:650;cursor:pointer;color:var(--fi-muted)}
.subnav button b{margin-left:4px;opacity:.7}
.subnav button.on{background:var(--exec);border-color:var(--exec);color:#fff}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .fi-input,.toolbar .fi-select{width:auto;min-width:0}
.toolbar .search{flex:1 1 220px;max-width:340px}
.seg{display:inline-flex;border:1px solid var(--fi-line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--fi-surface);padding:7px 12px;font:inherit;font-size:.76rem;font-weight:650;cursor:pointer;color:var(--fi-muted)}
.seg button+button{border-left:1px solid var(--fi-line)}
.seg button.on{background:var(--fi-text);color:var(--fi-surface)}

/* Implantação */
.flow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:18px}
.step{position:relative;padding:16px;display:flex;flex-direction:column;gap:6px}
.step:not(:last-child)::after{content:"";position:absolute;right:-14px;top:50%;width:10px;height:10px;border-top:2px solid var(--exec);border-right:2px solid var(--exec);transform:translateY(-50%) rotate(45deg)}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--exec);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.8rem}
.step h4{font-size:.9rem}
.step .d{font-size:.78rem;color:var(--fi-muted)}
.step .ent{font-size:.76rem;color:var(--fi-muted)}
.step .ent b{color:var(--fi-text)}
@media(max-width:1180px){.flow{grid-template-columns:repeat(3,minmax(0,1fr))}.step:nth-child(3)::after{display:none}}
@media(max-width:700px){.flow{grid-template-columns:1fr}.step::after{display:none}}
.board{display:grid;grid-template-columns:repeat(7,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--fi-surface-alt);border:1px solid var(--fi-line);border-radius:var(--fi-radius);padding:10px;min-height:120px}
.col-h{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--fi-muted);display:flex;justify-content:space-between;margin-bottom:8px}
.col-h b{color:var(--exec)}
.bcard{background:var(--fi-surface);border:1px solid var(--fi-line);border-radius:8px;padding:9px 10px;margin-bottom:8px;font-size:.82rem}
.bcard .t{font-weight:650}
.bcard .r{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:6px}
.mv{border:1px solid var(--fi-line);background:var(--fi-surface);border-radius:5px;cursor:pointer;color:var(--fi-muted);padding:1px 7px}
.mv:disabled{opacity:.35;cursor:default}

/* ADM */
.adm-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.adm-layout>*{min-width:0}
@media(max-width:900px){.adm-layout{grid-template-columns:1fr}}
.adm-nav{padding:8px}
.adm-nav button{display:flex;width:100%;justify-content:space-between;border:0;background:none;padding:10px 12px;border-radius:7px;font:inherit;font-size:.82rem;font-weight:650;cursor:pointer;color:var(--fi-muted);text-align:left}
.adm-nav button:hover{background:var(--fi-surface-alt)}
.adm-nav button.on{background:var(--fi-surface-alt);color:var(--fi-text);box-shadow:inset 3px 0 0 var(--fi-text)}
.adm-nav hr{border:0;border-top:1px solid var(--fi-line);margin:6px 4px}
.lists{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.lists textarea{width:100%;min-height:150px;font:inherit;font-size:.82rem;border:1px solid var(--fi-line);border-radius:7px;padding:8px 10px;background:var(--fi-surface);color:var(--fi-text);resize:vertical}

/* Modal */
dialog{border:0;padding:0;border-radius:10px;background:var(--fi-surface);color:var(--fi-text);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 24px 64px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(9,12,16,.55)}
.m-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--fi-line)}
.m-head h2{font-size:1rem;flex:1}
.m-body{padding:16px 18px;overflow:auto;display:grid;gap:12px}
.m-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--fi-line)}
.usage h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--fi-muted);margin:6px 0}
.usage ul{margin:0;padding-left:18px;font-size:.84rem}
.usage li{margin-bottom:3px}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--fi-muted)}
@media print{.menu,.fi-topbar__actions,.edit-bar,.head-actions,.toolbar,.subnav,.rm,.padd,.x,.add-row{display:none!important}}

/* =====================================================================
   3. SALVAMENTO COMPARTILHADO (com versão)
   Cada alteração é uma função aplicada ao estado. Se outra pessoa
   salvou antes, o projeto é recarregado e as alterações pendentes são
   reaplicadas por cima — ninguém perde o que editou.
   ===================================================================== */
let ops = [], saving = false, timer = null, syncState = '';
function commit(fn, rerender) {
  if (!canEdit) return;
  fn(S); ops.push(fn);
  if (rerender) render();
  clearTimeout(timer); timer = setTimeout(flush, 450); setSync('pendente');
}
async function fetchRemote() {
  const { data, error } = await sb.rpc('proj_fiorella_obter');
  if (error) throw error;
  return data && data[0] ? data[0] : null;
}
async function flush() {
  if (saving) { clearTimeout(timer); timer = setTimeout(flush, 400); return; }
  if (!ops.length) return;
  saving = true; setSync('salvando');
  try {
    let ok = false;
    for (let t = 0; t < 5 && !ok; t++) {
      const n = ops.length;
      const { data, error } = await sb.rpc('proj_fiorella_salvar', { p_dados: S, p_versao: VER });
      if (!error) {
        const r = data[0]; VER = r.versao; META = { em: r.atualizado_em, por: r.atualizado_por };
        ops.splice(0, n); ok = true; break;
      }
      if (!/conflito/.test(error.message || '')) throw error;
      const rem = await fetchRemote();
      S = migrate(rem ? rem.dados : clone(SEED)); VER = rem ? rem.versao : 0;
      ops.forEach(f => f(S));
      if (!typing()) render();
    }
    if (!ok) throw new Error('muitas edições simultâneas');
    setSync('ok');
  } catch (e) {
    console.error('[projeto] salvar', e);
    setSync('erro', /sem_permissao/.test(e.message || '') ? 'Sem permissão para editar' : 'Erro ao salvar — clique para tentar de novo');
  } finally {
    saving = false;
    if (ops.length && syncState !== 'erro') { clearTimeout(timer); timer = setTimeout(flush, 300); }
  }
}

  if (st === 'erro') { el.textContent = msg; el.dataset.act = 'retry'; return; }
  delete el.dataset.act;
  if (st === 'salvando' || st === 'pendente') { el.textContent = 'Salvando…'; return; }

}

const CONV = (col, x) => ui.edit && podeCad(col, 'excluir') && podeCad(VINC[col].outro, 'criar') ? `<button class="fi-btn bt-s" data-act="converter" data-col="${col}" data-id="${esc(x.id)}" title="Reclassificar sem perder informações">⇄ Converter em ${VINC[col].um}</button>` : '';
async function converter(col, id) {
  const x = byId(col, id); if (!x) return;
  const tgt = VINC[col].outro, ligados = vincIds(col, x).map(o => nome(tgt === 'processos' ? 'modulos' : 'processos', o)).filter(Boolean);
  if (!(await ask(`Converter “${x.nome}” em ${VINC[col].um}? Tudo o que foi lançado é mantido e aparece no cartão novo.${ligados.length ? ` Os vínculos atuais (${ligados.join(', ')}) ficam guardados e voltam se ele for convertido de novo.` : ''}`))) return;
  commit(st => {
    const arr = st[col], i = arr.findIndex(y => y.id === id); if (i < 0) return;
    const o = arr[i], novo = Object.assign(NEW[tgt](), clone(o));
    const atuais = col === 'modulos' ? st.processos.filter(p => (p.modulos || []).includes(id)).map(p => p.id) : (o.modulos || []).slice();
    const guardados = (o.exVinculos || []);
    if (col === 'modulos') {
      st.processos.forEach(p => { p.modulos = (p.modulos || []).filter(m => m !== id); });
      novo.modulos = guardados.filter(m => st.modulos.some(y => y.id === m && y.id !== id));
      delete novo.semProcesso;
    } else {
      delete novo.modulos;
      guardados.forEach(pid => { const p = st.processos.find(y => y.id === pid && y.id !== id); if (p) p.modulos = [...new Set([...(p.modulos || []), id])]; });
      novo.semProcesso = false;

    novo.convertido = { de: col, em: new Date().toISOString(), por: quemSou() };
    delete novo.pedido;

    const relAntes = o.exRel || []; novo.exRel = (o.rel || []).slice(); novo.rel = [];
    arr.splice(i, 1); st[tgt].push(novo);
    relAntes.forEach(r => setRel(st, tgt, id, r, true));
    st.modulos.forEach(m => { m.semProcesso = m.semProcesso && !st.processos.some(p => (p.modulos || []).includes(m.id)); });
  }, false);
  if (tgt === 'processos') { ui.procQ = x.nome; ui.procArea = '*'; ui.procStatus = ''; ui.procMod = ''; } else { ui.modQ = x.nome; ui.modPrio = ''; }

/* Relação entre itens do mesmo tipo (módulo ⇄ módulo, processo ⇄ processo) — sempre nos dois sentidos */

}

function COND(col, x) {

/* Chips do vínculo recíproco módulo ⇄ processo */
function VINCS(col, it) {
  const v = VINC[col], ids = vincIds(col, it), ed = ui.edit && podeCad(col, 'editar') && podeCad(v.outro, 'editar');
  let h = ids.map(oid => { const o = byId(v.outro, oid); if (!o) return '';
    return `<span class="pw"><button class="vchip" data-act="vinc-ir" data-col="${v.outro}" data-id="${esc(oid)}" title="Abrir">${esc(o.nome)}</button>${ed ? `<button class="x" data-act="vinc-rm" data-col="${col}" data-id="${esc(it.id)}" data-o="${esc(oid)}" title="Desvincular">×</button>` : ''}</span>`; }).join('');

  return `<span class="ppl">${h}</span>`;
}

/* Vínculos de um participante em todo o projeto */
function usage(pid) {
  const tok = '@' + pid, out = [];
  for (const col in PEOPLE_FIELDS) for (const it of S[col] || []) for (const [k, l] of PEOPLE_FIELDS[col]) if ((it[k] || []).includes(tok)) out.push({ col, nome: it.nome || it.titulo, papel: l });
  S.projeto.fases.forEach(f => { if ((f.lid || []).includes(tok)) out.push({ col: 'fases', nome: `Fase ${f.n} — ${f.nome}`, papel: 'Liderança' }); });

}

function arrOf(st, col) { return col.includes('.') ? getP(st, col) : st[col]; }
function addItem(col) {
  const it = Object.assign({ id: uid(col.split('.').pop()) }, NEW[col]());
  commit(st => { arrOf(st, col).push(clone(it)); }, false);
  if (col === 'processos') { ui.procStatus = ''; ui.procQ = ''; ui.procMod = ''; }
  if (col === 'modulos') { ui.modPrio = ''; ui.modQ = ''; }
  if (col === 'ideias') ui.ideiaStatus = '';
  const k = it.nome !== undefined ? 'nome' : it.titulo !== undefined ? 'titulo' : 't';
  ui.focus = `[data-p="${col}.#${it.id}.${k}"]`;
  render();
}
async function removeItem(col, id) {
  const it = (arrOf(S, col) || []).find(x => x.id === id); if (!it) return;
  const label = it.nome || it.titulo || it.t || 'item';
  let msg = `Excluir “${label}”?`;
  if (col === 'modulos') { const n = procsDoModulo(id), orf = n.filter(p => p.modulos.length === 1).length; if (n.length) msg += ` ${n.length} processo(s) vinculado(s) perdem este vínculo${orf ? `; ${orf} ficará(ão) sem módulo` : ''}.`; }
  if (col === 'processos' && it.modulos && it.modulos.length) msg += ` O vínculo com ${it.modulos.length} módulo(s) será removido.`;
  if (col === 'participantes') { const u = usage(id).length; if (u) msg += ` ${label} aparece em ${u} lugar(es); o nome será mantido como texto. Se a pessoa apenas saiu do projeto, prefira o status Inativo.`; }
  if (!(await ask(msg, true))) return;
  commit(st => {
    const clr = (c, k) => (st[c] || []).forEach(x => { if (x[k] === id) x[k] = ''; });
    if (col === 'participantes') {
      const tok = '@' + id, fix = a => (a || []).map(t => t === tok ? label : t);
      const todos = [...PEOPLE_FIELDS.modulos, ...PEOPLE_FIELDS.processos];
      for (const c in PEOPLE_FIELDS) (st[c] || []).forEach(x => (c === 'modulos' || c === 'processos' ? todos : PEOPLE_FIELDS[c]).forEach(([k]) => { if (Array.isArray(x[k])) x[k] = fix(x[k]); }));
      st.projeto.fases.forEach(f => { f.lid = fix(f.lid); });
    }
    if (col === 'areas') { clr('participantes', 'area'); clr('processos', 'area'); clr('ideias', 'area'); }
    if (col === 'tipos') clr('participantes', 'tipo');
    if (col === 'modulos') (st.processos || []).forEach(p => { p.modulos = (p.modulos || []).filter(m => m !== id); });
    if (col === 'modulos' || col === 'processos') (st[col] || []).forEach(x => { if (x.rel) x.rel = x.rel.filter(o => o !== id); });
    const arr = arrOf(st, col), i = arr.findIndex(x => x.id === id); if (i >= 0) arr.splice(i, 1);
  }, true);
}

  if (!podeCad(col, 'criar')) { notify('Sem permissão para cadastrar.', 'warning'); return; }
  const v = VINC[col], cfg = cfgCad(col);

    if (e.key === 'Escape') { t.textContent = t.dataset.orig || ''; t.blur(); }
  }
  if (t.id === 'pkTxt' && e.key === 'Enter') { e.preventDefault(); modal.querySelector('[data-act="pk-ok"]').click(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.cond) { const [c, id] = t.dataset.cond.split(':'), v = t.value; commit(st => { const y = st[c].find(z => z.id === id); if (!y || (y.cond || 'Normal') === v) return; y.cond = v; novaNota(st, c, id, `Alterou a condição para: ${v}.`, { sis: true }); }, true); renderMenu(); return; }
  if (t.dataset && t.dataset.menFor) { const ta = document.querySelector(`[data-nota-txt="${t.dataset.menFor}"]`); if (ta && t.value) { ta.value = (ta.value && !/\s$/.test(ta.value) ? ta.value + ' ' : ta.value) + '@' + t.value + ' '; ta.focus(); } t.value = ''; return; }
  if (t.dataset && t.dataset.upper !== undefined) { const c = t.selectionStart; t.value = UP(t.value); try { t.setSelectionRange(c, c); } catch (err) {} }
  if (t.classList.contains('es')) { const p = t.dataset.p, v = t.value; commit(st => setP(st, p, v), true); return; }
  if (t.dataset.cfg && isAdm) { const p = t.dataset.cfg, v = t.type === 'checkbox' ? t.checked : t.value; commit(st => setP(st, p, v), true); return; }
  if (t.dataset.lista) { const k = t.dataset.lista, v = t.value.split('\n').map(s => s.trim()).filter(Boolean); commit(st => { st.listas[k] = v; }, false); }
});
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.upper !== undefined) { const t = e.target, c = t.selectionStart; t.value = UP(t.value); try { t.setSelectionRange(c, c); } catch (err) {} return; } const k = e.target.dataset && e.target.dataset.ui; if (!k) return; ui[k] = e.target.value; (FILLS[ui.tab] || render)(); });
modal.addEventListener('click', e => { if (e.target === modal) modal.close(); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== ui.tab) go(h); });

/* =====================================================================
   10. INÍCIO — espera o login (guard.js) e carrega o projeto do banco
   ===================================================================== */
function fatal(msg) { $('#view').innerHTML = `<div class="fi-card fi-empty"><div><strong>Não foi possível abrir o projeto</strong><br>${esc(msg)}</div></div>`; }
(async function init() {
  if (!window.APP || !APP.pronto) { fatal('A Central de Acesso Fiorella não carregou. Confira a conexão e recarregue a página.'); return; }
  try { await APP.pronto; } catch (e) { return; } /* o guard já mostrou login / aviso */
  sb = APP.sb; canEdit = APP.podeEditar(); isAdm = APP.eAdmin();
  try { ui.edit = canEdit && sessionStorage.getItem('projetoFiorella.edit') === '1'; } catch (e) {}
  try {
    const rem = await fetchRemote();
    if (rem) { S = migrate(rem.dados); VER = rem.versao; META = { em: rem.atualizado_em, por: rem.atualizado_por }; }
    else {
      /* Primeiro acesso: base da planilha (ou os dados da versão anterior salvos neste navegador) */
      S = migrate(clone(SEED)); VER = 0;
      let local = null; try { local = JSON.parse(localStorage.getItem('projetoFiorella.v1') || 'null'); } catch (e) {}
      if (canEdit) {
        const usarLocal = local && Array.isArray(local.participantes) && await ask('Encontramos dados da versão anterior salvos neste navegador. Usar esses dados como ponto de partida do projeto compartilhado?');
        replaceAll(usarLocal ? migrate(local) : S);
      }
    }
  } catch (e) {
    console.error('[projeto] carregar', e);
    fatal(/sem_permissao/.test(e.message || '') ? 'Seu usuário não tem acesso a esta ferramenta.' : 'Erro ao carregar os dados do projeto. Recarregue a página.');
    return;
  }
  const me = norm(APP.usuario && APP.usuario.email), p = me && S.participantes.find(x => norm(x.email) === me);
  USER_TOK = p ? '@' + p.id : '';
  setSync(ops.length ? 'pendente' : 'ok');
  let first = location.hash.slice(1);
  if (!first) try { first = localStorage.getItem('projetoFiorella.tab') || ''; } catch (e) {}
  go(first || 'modulos');
})();
</script>
