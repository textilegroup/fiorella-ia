<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projeto Fiorella</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* =====================================================================
   PROJETO FIORELLA — Plataforma Corporativa
   ---------------------------------------------------------------------
   Padrão visual Fiorella UI: cabeçalho institucional, menu horizontal
   de guias, fundo claro, cards brancos e detalhes em vermelho Fiorella.
   Sem banco de dados: os dados iniciais ficam no objeto SEED (JS) e as
   alterações são salvas no navegador (localStorage). Use ADM → Dados
   para exportar/importar o JSON completo.
   Todas as cores saem de tokens; o tema escuro só redefine os tokens.
   ===================================================================== */
:root{
  --red:#C8102E; --red-deep:#8E0B20; --red-soft:#E04A5F; --red-tint:#FCEEF0;
  --bg:#F3F3F1; --card:#FFFFFF; --sunk:#F8F7F5;
  --ink:#232228; --ink-2:#56545C; --ink-3:#8C8A92;
  --line:#E4E2DF; --line-2:#EFEDEA;
  --ok:#2E7D4F; --ok-bg:#E8F4EC;
  --info:#2563A6; --info-bg:#E8F0FA;
  --warn:#A8690F; --warn-bg:#FBF1E0;
  --neutral:#5E5C64; --neutral-bg:#EFEEEC;
  --mute:#9A98A0; --mute-bg:#F2F1EF;
  --shadow:0 1px 2px rgba(35,34,40,.06),0 2px 10px rgba(35,34,40,.05);
  --overlay:rgba(35,34,40,.5);
  --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --red:#D2334B; --red-deep:#7A0A1C; --red-soft:#F07184; --red-tint:#3A1820;
    --bg:#131215; --card:#1D1C20; --sunk:#252328;
    --ink:#F0EEEB; --ink-2:#B5B1B8; --ink-3:#85818A;
    --line:#333037; --line-2:#29272D;
    --ok:#62B585; --ok-bg:#1C2E23; --info:#6FA3E6; --info-bg:#1B2636;
    --warn:#D9A049; --warn-bg:#33291A; --neutral:#B5B1B8; --neutral-bg:#2A282E;
    --mute:#7C7882; --mute-bg:#232126;
    --shadow:0 1px 2px rgba(0,0,0,.45); --overlay:rgba(8,8,10,.65);
  }
}
:root[data-theme="dark"]{
  --red:#D2334B; --red-deep:#7A0A1C; --red-soft:#F07184; --red-tint:#3A1820;
  --bg:#131215; --card:#1D1C20; --sunk:#252328;
  --ink:#F0EEEB; --ink-2:#B5B1B8; --ink-3:#85818A;
  --line:#333037; --line-2:#29272D;
  --ok:#62B585; --ok-bg:#1C2E23; --info:#6FA3E6; --info-bg:#1B2636;
  --warn:#D9A049; --warn-bg:#33291A; --neutral:#B5B1B8; --neutral-bg:#2A282E;
  --mute:#7C7882; --mute-bg:#232126;
  --shadow:0 1px 2px rgba(0,0,0,.45); --overlay:rgba(8,8,10,.65);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red-soft);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.2}
a{color:var(--red)}
.muted{color:var(--ink-3)}
.wrap{max-width:1480px;margin:0 auto;padding:0 20px}

/* ===== Cabeçalho institucional ===== */
.top{background:linear-gradient(100deg,var(--red-deep) 0%,var(--red) 60%,var(--red-deep) 100%);color:#fff}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:40px;height:40px;border-radius:9px;background:#fff;color:var(--red-deep);display:grid;place-items:center;font-weight:800;font-size:20px;flex:none;letter-spacing:-.5px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:16px;letter-spacing:.14em;font-weight:800}
.brand-txt span{display:block;font-size:12px;opacity:.85}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.saved{font-size:12px;opacity:.85;white-space:nowrap}
.btn-top{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer}
.btn-top:hover{background:rgba(255,255,255,.24)}

/* ===== Menu superior de guias ===== */
.tabs{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;box-shadow:var(--shadow)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:14px 14px 11px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--sunk)}
.tab.on{color:var(--red);border-bottom-color:var(--red)}
.tab.adm{margin-left:auto}

/* ===== Conteúdo ===== */
main{padding:22px 0 60px}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:22px;font-weight:800}
.page-head p{margin:4px 0 0;color:var(--ink-2);max-width:820px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.section-title{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.section-title::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--red)}
.section-title .count{font-weight:600;color:var(--ink-3);letter-spacing:0;text-transform:none}
.section-title .actions{margin-left:auto;text-transform:none;letter-spacing:0}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:16px 18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.gauto-s{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
@media (max-width:980px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}.gauto,.gauto-s{grid-template-columns:1fr}.wrap{padding:0 16px}}

/* KPIs */
.kpi{padding:14px 16px;border-top:3px solid var(--red)}
.kpi .v{font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--ink-2);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:6px}
button.kpi{text-align:left;cursor:pointer;width:100%;font:inherit}
button.kpi:hover{border-color:var(--red-soft)}

/* Botões */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-deep);border-color:var(--red-deep)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.sm{padding:4px 9px;font-size:12px}
.icon-btn{border:1px solid transparent;background:none;border-radius:6px;padding:3px 7px;cursor:pointer;color:var(--ink-3);font-size:13px}
.icon-btn:hover{border-color:var(--line);color:var(--ink);background:var(--sunk)}

/* Pills e chips */
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;letter-spacing:.02em}
.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-info{background:var(--info-bg);color:var(--info)}
.t-warn{background:var(--warn-bg);color:var(--warn)}
.t-neutral{background:var(--neutral-bg);color:var(--neutral)}
.t-mute{background:var(--mute-bg);color:var(--mute)}
.t-hi{background:var(--red-tint);color:var(--red)}
.t-mid{background:var(--warn-bg);color:var(--warn)}
.t-low{background:var(--neutral-bg);color:var(--neutral)}
.tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;background:var(--sunk);border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:2px 10px 2px 2px;font-size:12px;font-weight:600;cursor:pointer;margin:0 4px 4px 0;max-width:100%}
.pchip:hover{border-color:var(--red-soft)}
.pchip.off{opacity:.55;text-decoration:line-through}
.av{width:22px;height:22px;border-radius:50%;background:var(--red-tint);color:var(--red);display:grid;place-items:center;font-size:10px;font-weight:800;flex:none}
.av.lg{width:44px;height:44px;font-size:15px}
.tchip{display:inline-block;border:1px dashed var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--ink-2);margin:0 4px 4px 0}

/* Filtros */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.input,.select{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:7px 10px;font-size:13px;min-width:0}
.input:focus,.select:focus{border-color:var(--red-soft);outline:none}
.search{flex:1 1 220px;max-width:340px}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subnav button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.subnav button b{font-weight:700;color:var(--ink-3);margin-left:4px}
.subnav button.on{background:var(--red);border-color:var(--red);color:#fff}
.subnav button.on b{color:#fff;opacity:.8}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--card)}

/* Tabelas */
.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--sunk)}
.tbl .w-act{width:1%;white-space:nowrap;text-align:right}

/* Visão geral */
.hero{padding:22px 24px;border-left:5px solid var(--red)}
.hero .eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.hero h2{font-size:20px;font-weight:800;margin:6px 0 8px}
.hero p{margin:0;color:var(--ink-2);font-size:15px;max-width:920px}
.layers{display:grid;gap:10px}
.layer{display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:center;padding:14px 18px;border-radius:var(--radius);border:1px solid var(--line);background:var(--card)}
.layer .ln{font-weight:800;font-size:15px}
.layer .ln small{display:block;font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.layer p{margin:0;color:var(--ink-2)}
.layer.ia{border-style:dashed;background:var(--sunk)}
.layer.plat{border-color:var(--red-soft);background:var(--red-tint)}
.layer.plat .ln{color:var(--red)}
.layer-arrow{text-align:center;color:var(--ink-3);font-size:12px;font-weight:600}
@media (max-width:640px){.layer{grid-template-columns:1fr;gap:4px}}
.principle h4{font-size:14px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.principle h4 span{width:24px;height:24px;border-radius:6px;background:var(--red-tint);color:var(--red);display:grid;place-items:center;font-size:12px;font-weight:800}
.principle p{margin:0;color:var(--ink-2);font-size:13px}
.phases{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.phases{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.phases{grid-template-columns:1fr}}
.phase{padding:14px;position:relative}
.phase .n{font-size:26px;font-weight:800;color:var(--red);line-height:1}
.phase h4{font-size:14px;margin:6px 0 4px}
.phase p{margin:0 0 8px;font-size:12px;color:var(--ink-2)}
.phase .ent{font-size:12px;color:var(--ink-3);margin-bottom:8px}

/* Pessoas */
.person{padding:16px;display:flex;flex-direction:column;gap:10px}
.person-head{display:flex;gap:12px;align-items:center}
.person-head h3{font-size:15px}
.person-head .cargo{font-size:12px;color:var(--ink-2);margin-top:2px}
.person .resp{font-size:13px;color:var(--ink-2);margin:0}
.person .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.person .foot{border-top:1px solid var(--line-2);padding-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-3);gap:8px}
.group-label{font-size:13px;font-weight:700;color:var(--ink-2);margin:18px 0 10px}

/* Cards genéricos de item */
.item{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.item-head{display:flex;gap:10px;align-items:flex-start}
.item-head h3{font-size:15px;font-weight:700;flex:1;min-width:0}
.item-head .sub{font-size:12px;color:var(--ink-3);font-weight:500;margin-top:3px}
.item p{margin:0;font-size:13px;color:var(--ink-2)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.kv>div{min-width:0}
.kv .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;margin-bottom:3px}
.kv .v{font-size:13px}
.kv .full{grid-column:1/-1}
.next{background:var(--sunk);border-left:3px solid var(--red);padding:8px 10px;border-radius:0 6px 6px 0;font-size:13px;color:var(--ink-2)}
.next b{color:var(--ink);font-size:11px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:2px}
.item .foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line-2);padding-top:10px}
.item .foot .grow{flex:1}
.clickable{cursor:pointer;transition:border-color .12s}
.clickable:hover{border-color:var(--red-soft)}

/* Processos — cartão no formato do futuro sistema */
.proc{padding:0;overflow:hidden}
.proc-top{padding:14px 18px 12px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line-2)}
.proc-top h3{font-size:15px;font-weight:700}
.proc-top .sub{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}
.proc-top .grow{flex:1;min-width:0}
.raci{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.raci>div{padding:10px 18px;border-bottom:1px solid var(--line-2);min-width:0}
.raci>div:not(:nth-child(3n)){border-right:1px solid var(--line-2)}
.raci .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.raci .k i{font-style:normal;width:16px;height:16px;border-radius:4px;background:var(--red-tint);color:var(--red);display:grid;place-items:center;font-size:9.5px;font-weight:800}
@media (max-width:640px){.raci{grid-template-columns:repeat(2,minmax(0,1fr))}.raci>div{border-right:0!important}.raci>div:nth-child(odd){border-right:1px solid var(--line-2)!important}}
.proc-bottom{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px 18px;background:var(--sunk);font-size:12px}
.proc-bottom .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700}
@media (max-width:640px){.proc-bottom{grid-template-columns:1fr}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:14px}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{font-style:normal;width:16px;height:16px;border-radius:4px;background:var(--red-tint);color:var(--red);display:grid;place-items:center;font-size:9.5px;font-weight:800}

/* Implantação */
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;counter-reset:st}
.step{position:relative;padding:16px 16px 16px 16px;background:var(--card);border:1px solid var(--line);margin-right:18px;border-radius:var(--radius)}
.step:not(:last-child)::after{content:"";position:absolute;right:-15px;top:50%;width:12px;height:12px;border-top:2px solid var(--red);border-right:2px solid var(--red);transform:translateY(-50%) rotate(45deg)}
.step:last-child{margin-right:0}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;margin-bottom:8px}
.step h4{font-size:14px;margin-bottom:6px}
.step p{margin:0 0 8px;font-size:12px;color:var(--ink-2)}
.step .ent{font-size:12px;color:var(--ink-3)}
.step .ent b{color:var(--ink-2)}
@media (max-width:1100px){.flow{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:14px}.step:nth-child(3)::after{display:none}}
@media (max-width:640px){.flow{grid-template-columns:1fr}.step{margin-right:0}.step::after{display:none}}
.board{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-height:120px}
.col-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);display:flex;justify-content:space-between;margin-bottom:8px}
.col-h b{color:var(--red)}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;font-size:13px}
.bcard .t{font-weight:600;cursor:pointer}
.bcard .t:hover{color:var(--red)}
.bcard .r{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:6px}

/* ADM */
.adm-layout{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
@media (max-width:820px){.adm-layout{grid-template-columns:1fr}}
.adm-nav{padding:8px}
.adm-nav button{display:flex;width:100%;justify-content:space-between;border:0;background:none;padding:10px 12px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2);text-align:left}
.adm-nav button:hover{background:var(--sunk)}
.adm-nav button.on{background:var(--red-tint);color:var(--red)}
.adm-nav button b{font-weight:700;opacity:.7}
.adm-nav hr{border:0;border-top:1px solid var(--line-2);margin:6px 4px}
.note{font-size:12px;color:var(--ink-2);background:var(--sunk);border:1px solid var(--line-2);border-radius:8px;padding:10px 12px}

/* Conceitos (tarefas) */
.concept h4{font-size:14px;margin-bottom:6px}
.concept p{margin:0;font-size:13px;color:var(--ink-2)}
.lifecycle{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.lifecycle .arr{color:var(--ink-3)}

/* Modal */
dialog{border:0;padding:0;border-radius:12px;background:var(--card);color:var(--ink);width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:var(--overlay)}
.m-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.m-head h2{font-size:16px;font-weight:800;flex:1}
.m-body{padding:16px 20px;overflow:auto}
.m-foot{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card)}
.m-foot .grow{flex:1}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
@media (max-width:640px){.form{grid-template-columns:1fr}}
.fld label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);margin-bottom:5px}
.fld label em{color:var(--red);font-style:normal}
.fld .input,.fld .select,.fld textarea{width:100%}
.fld textarea{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:8px 10px;font-size:13px;min-height:70px;resize:vertical}
.fld textarea:focus{border-color:var(--red-soft);outline:none}
.fld .hint{font-size:11px;color:var(--ink-3);margin-top:4px}
.picker{border:1px solid var(--line);border-radius:7px;padding:6px;background:var(--card)}
.picker .chips{min-height:26px;display:flex;flex-wrap:wrap;align-items:center}
.picker .chips .empty{font-size:12px;color:var(--ink-3);padding:3px 4px}
.picker .ctl{display:flex;gap:6px;margin-top:4px}
.picker .ctl select{flex:1 1 50%}
.picker .ctl input{flex:1 1 50%}
.pk-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 3px;margin:0 4px 4px 0;font-size:12px;font-weight:600;background:var(--sunk)}
.pk-chip.txt{border-style:dashed;padding-left:9px;font-weight:500}
.pk-chip button{border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:14px;line-height:1;padding:0 4px}
.pk-chip button:hover{color:var(--red)}
.usage h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:14px 0 6px}
.usage ul{margin:0;padding-left:18px;font-size:13px}
.usage li{margin-bottom:3px}

.empty-state{padding:30px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:var(--radius);background:var(--card)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{border-top:1px solid var(--line);padding:16px 0;font-size:12px;color:var(--ink-3)}
footer .wrap{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
@media print{.tabs,.top-actions,.actions,.toolbar,.subnav,.icon-btn,footer{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
</head>

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { const d = JSON.parse(raw); if (d && d.participantes) return fillMissing(d); }
  } catch (e) {}
  return clone(SEED);
}
function fillMissing(d) { for (const k in SEED) if (d[k] === undefined) d[k] = clone(SEED[k]); return d; }
function persist(msg) {
  S._savedAt = new Date().toISOString();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
  stamp(); if (msg) toast(msg);
}
function stamp() {
  const el = document.getElementById('savedAt');
  if (!S._savedAt) { el.textContent = 'Dados iniciais da planilha'; return; }
  const d = new Date(S._savedAt);
  el.textContent = 'Salvo ' + d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

const $ = s => document.querySelector(s);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function slug(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 24) || 'item'; }
function newId(col, base) { let id = slug(base), n = 2; while (S[col].some(x => x.id === id)) id = slug(base) + '_' + n++; return id; }
const byId = (col, id) => (S[col] || []).find(x => x.id === id);
const nome = (col, id) => { const x = byId(col, id); return x ? x.nome : ''; };
function initials(n) { return String(n).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase(); }
function tokName(t) { if (!t) return ''; if (t[0] === '@') { const p = byId('participantes', t.slice(1)); return p ? p.nome : ''; } return t; }
function chips(toks, empty = 'A definir') {
  const out = (toks || []).filter(Boolean).map(t => {
    if (t[0] === '@') {
      const p = byId('participantes', t.slice(1)); if (!p) return '';
      return `<button class="pchip${p.status === 'Inativo' ? ' off' : ''}" data-act="person" data-id="${esc(p.id)}" title="${esc(p.cargo)}"><span class="av">${esc(initials(p.nome))}</span>${esc(p.nome)}</button>`;
    }
    return `<span class="tchip">${esc(t)}</span>`;
  }).join('');
  return out || `<span class="muted">${esc(empty)}</span>`;
}
const TONE = { 'Ativo': 'ok', 'Em uso': 'ok', 'Implantado': 'ok', 'Concluída': 'ok', 'Em produção': 'ok', 'Aprovado': 'ok', 'Aprovada': 'ok', 'Sim': 'ok',
  'Em andamento': 'info', 'Em mapeamento': 'info', 'Em definição': 'info', 'Em construção': 'info', 'Em homologação': 'info', 'Em análise': 'info',
  'Definida': 'ok', 'Aguardando': 'warn', 'Pausado': 'warn', 'Em revisão': 'warn', 'Pendente': 'warn',
  'Inativo': 'mute', 'Cancelada': 'mute', 'Descartada': 'mute', 'Não': 'mute',
  'Alta': 'hi', 'Média': 'mid', 'Baixa': 'low' };
function pill(s) { return s ? `<span class="pill t-${TONE[s] || 'neutral'}">${esc(s)}</span>` : ''; }
function prio(s) { return s ? `<span class="pill t-${TONE[s] || 'neutral'}" title="Prioridade">▲ ${esc(s)}</span>` : ''; }
function fmtDate(d) { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y}`; }
function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }
const optList = (arr, sel, blank) => (blank !== undefined ? `<option value="">${esc(blank)}</option>` : '') + arr.map(o => `<option${o === sel ? ' selected' : ''}>${esc(o)}</option>`).join('');
const isOpen = t => t.status !== 'Concluída' && t.status !== 'Cancelada';
const overdue = t => isOpen(t) && t.prazo && t.prazo < new Date().toISOString().slice(0, 10);

/* Onde um participante aparece (alimentação automática das guias) */
function usage(pid) {
  const tok = '@' + pid, out = [];
  for (const col in SCHEMAS) {
    const pf = SCHEMAS[col].fields.filter(f => f.t === 'people' || f.t === 'person');
    for (const it of S[col]) for (const f of pf) if ((it[f.k] || []).includes(tok)) out.push({ col, id: it.id, nome: it.nome || it.titulo, papel: f.l });
  }
  S.projeto.fases.forEach(f => { if (f.lid.includes(tok)) out.push({ col: 'fases', nome: `Fase ${f.n} — ${f.nome}`, papel: 'Liderança' }); });
  return out;
}

function vEquipe() {

const VIEWS = { visao: vVisao, equipe: vEquipe, sistemas: vSistemas, modulos: vModulos, processos: vProcessos, tarefas: vTarefas, implantacao: vImplantacao, backlog: vBacklog, adm: vAdm };
const FILLS = { modulos: fillModulos, processos: fillProcessos, tarefas: fillTarefas };

/* =====================================================================
   7. FORMULÁRIO GENÉRICO (modal)
   ===================================================================== */
const modal = $('#modal');
let form = null; // { col, id, draft }

function openForm(col, id, preset) {
  const sch = SCHEMAS[col];
  const src = id ? byId(col, id) : null;
  const draft = src ? clone(src) : {};
  if (!src) sch.fields.forEach(f => { draft[f.k] = (f.t === 'people' || f.t === 'person') ? [] : (f.def || ''); });
  if (preset) Object.assign(draft, preset);
  form = { col, id, draft };
  modal.innerHTML = `
    <div class="m-head"><h2>${src ? 'Editar' : 'Novo(a)'} ${esc(sch.label.toLowerCase())}</h2><button class="icon-btn" data-act="close" title="Fechar">✕</button></div>
    <div class="m-body"><div class="form">${sch.fields.map(f => fieldHtml(f, draft[f.k])).join('')}</div></div>
    <div class="m-foot">${src ? `<button class="btn danger" data-act="del">Excluir</button>` : ''}<span class="grow"></span><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="save">Salvar</button></div>`;
  sch.fields.filter(f => f.t === 'people' || f.t === 'person').forEach(f => drawPicker(f.k));
  if (!modal.open) modal.showModal();
  const first = modal.querySelector('.m-body input, .m-body select, .m-body textarea'); if (first && !src) first.focus();
}
function fieldHtml(f, v) {
  const lab = `<label for="f_${f.k}">${esc(f.l)}${f.req ? ' <em>*</em>' : ''}</label>`;
  const cls = `fld${f.full || f.t === 'textarea' ? ' full' : ''}`;
  switch (f.t) {
    case 'textarea': return `<div class="${cls}">${lab}<textarea id="f_${f.k}" data-f="${f.k}">${esc(v)}</textarea></div>`;
    case 'select': return `<div class="${cls}">${lab}<select class="select" id="f_${f.k}" data-f="${f.k}">${optList(f.opts, v, '—')}</select></div>`;
    case 'ref': return `<div class="${cls}">${lab}<select class="select" id="f_${f.k}" data-f="${f.k}"><option value="">—</option>${S[f.ref].map(x => `<option value="${esc(x.id)}"${x.id === v ? ' selected' : ''}>${esc(x.nome)}</option>`).join('')}</select></div>`;
    case 'date': return `<div class="${cls}">${lab}<input type="date" class="input" id="f_${f.k}" data-f="${f.k}" value="${esc(v)}"></div>`;
    case 'people': case 'person': return `<div class="${cls}">${lab}<div class="picker" data-pk="${f.k}" data-single="${f.t === 'person' ? 1 : ''}"><div class="chips"></div>
      <div class="ctl"><select class="select" data-pk-sel="${f.k}"><option value="">＋ Participante…</option></select>
      <input class="input" data-pk-txt="${f.k}" placeholder="ou texto (Enter)"></div></div>
      <div class="hint">${f.t === 'person' ? 'Uma pessoa ou texto (ex.: Gestor da área).' : 'Participantes cadastrados ou texto livre (ex.: Financeiro, Solicitante).'}</div></div>`;
    default: return `<div class="${cls}">${lab}<input class="input" id="f_${f.k}" data-f="${f.k}" value="${esc(v)}"${f.ph ? ` placeholder="${esc(f.ph)}"` : ''}></div>`;
  }
}
function drawPicker(k) {
  const box = modal.querySelector(`[data-pk="${k}"]`); if (!box) return;
  const toks = form.draft[k] || [];
  box.querySelector('.chips').innerHTML = toks.length ? toks.map((t, i) => {
    if (t[0] === '@') { const p = byId('participantes', t.slice(1)); return `<span class="pk-chip"><span class="av">${esc(initials(p ? p.nome : '?'))}</span>${esc(p ? p.nome : '(removido)')}<button type="button" data-act="pk-rm" data-k="${k}" data-i="${i}" title="Remover">×</button></span>`; }
    return `<span class="pk-chip txt">${esc(t)}<button type="button" data-act="pk-rm" data-k="${k}" data-i="${i}" title="Remover">×</button></span>`;
  }).join('') : '<span class="empty">A definir</span>';
  const sel = box.querySelector('select');
  const ativos = S.participantes.filter(p => p.status === 'Ativo' && !toks.includes('@' + p.id)).sort((a, b) => a.nome.localeCompare(b.nome));
  sel.innerHTML = `<option value="">＋ Participante…</option>` + ativos.map(p => `<option value="@${esc(p.id)}">${esc(p.nome)} — ${esc(p.cargo)}</option>`).join('');
}
function pkAdd(k, tok) {
  tok = tok.trim(); if (!tok) return;
  const single = modal.querySelector(`[data-pk="${k}"]`).dataset.single;
  /* texto igual ao nome de um participante vira vínculo com o cadastro */
  if (tok[0] !== '@') { const p = S.participantes.find(x => norm(x.nome) === norm(tok)); if (p) tok = '@' + p.id; }
  let arr = form.draft[k] || [];
  if (arr.includes(tok)) return;
  arr = single ? [tok] : [...arr, tok];
  form.draft[k] = arr; drawPicker(k);
}
function saveForm() {
  const { col, id, draft } = form, sch = SCHEMAS[col];
  modal.querySelectorAll('[data-f]').forEach(el => { draft[el.dataset.f] = el.value.trim(); });
  modal.querySelectorAll('[data-pk-txt]').forEach(el => { if (el.value.trim()) pkAdd(el.dataset.pkTxt, el.value); });
  for (const f of sch.fields) if (f.req && !draft[f.k]) { toast(`Preencha: ${f.l}`); modal.querySelector(`#f_${f.k}`)?.focus(); return; }
  if (col === 'participantes' && S.participantes.some(p => p.id !== id && norm(p.nome) === norm(draft.nome))) { toast('Já existe um participante com esse nome.'); return; }
  if (id) { const i = S[col].findIndex(x => x.id === id); S[col][i] = draft; }
  else { draft.id = newId(col, draft.nome || draft.titulo); S[col].push(draft); }
  modal.close(); persist('Salvo'); render();
}
function deleteItem() {
  const { col, id } = form, it = byId(col, id), label = it.nome || it.titulo;
  let msg = `Excluir “${label}”?`;
  if (col === 'participantes') { const u = usage(id).length; if (u) msg += `\n\n${it.nome} aparece em ${u} lugar(es). O nome será mantido como texto nesses lugares.\nSe a pessoa apenas saiu do projeto, prefira marcá-la como Inativo.`; }
  if (!confirm(msg)) return;
  if (col === 'participantes') {
    const tok = '@' + id;
    for (const c in SCHEMAS) SCHEMAS[c].fields.filter(f => f.t === 'people' || f.t === 'person').forEach(f => S[c].forEach(x => { if (x[f.k]) x[f.k] = x[f.k].map(t => t === tok ? it.nome : t); }));
    S.projeto.fases.forEach(f => { f.lid = f.lid.map(t => t === tok ? it.nome : t); });
  }
  const clear = (c, k) => S[c].forEach(x => { if (x[k] === id) x[k] = ''; });
  if (col === 'areas') { clear('participantes', 'area'); clear('processos', 'area'); clear('ideias', 'area'); }
  if (col === 'tipos') clear('participantes', 'tipo');
  if (col === 'modulos') { clear('processos', 'modulo'); clear('tarefas', 'modulo'); }
  if (col === 'processos') clear('tarefas', 'processo');
  S[col] = S[col].filter(x => x.id !== id);
  modal.close(); persist('Excluído'); render();
}
function showPerson(pid) {
  const p = byId('participantes', pid); if (!p) return;
  const u = usage(pid), groups = {};
  u.forEach(x => { (groups[x.col] = groups[x.col] || []).push(x); });
  const lbl = { ...COL_LABEL_PLURAL, fases: 'Fases do projeto' };
  modal.innerHTML = `
    <div class="m-head"><span class="av lg">${esc(initials(p.nome))}</span><h2>${esc(p.nome)}<div class="muted" style="font-size:12px;font-weight:500;margin-top:3px">${esc(p.cargo)}</div></h2><button class="icon-btn" data-act="close">✕</button></div>
    <div class="m-body">
      <div class="kv">
        <div><div class="k">Área</div><div class="v">${esc(nome('areas', p.area)) || '—'}</div></div>
        <div><div class="k">Papel no projeto</div><div class="v">${esc(nome('tipos', p.tipo)) || '—'}</div></div>
        <div><div class="k">Nível de atuação</div><div class="v">${esc(p.nivel) || '—'}</div></div>
        <div><div class="k">Status</div><div class="v">${pill(p.status)}</div></div>
        ${p.resp ? `<div class="full"><div class="k">Responsabilidades</div><div class="v">${esc(p.resp)}</div></div>` : ''}
        ${p.foco ? `<div class="full"><div class="k">Foco de decisão</div><div class="v">${esc(p.foco)}</div></div>` : ''}

      <div class="usage">${u.length ? Object.entries(groups).map(([c, l]) => `<h4>${esc(lbl[c] || c)} · ${l.length}</h4><ul>${l.map(x => `<li>${x.id ? `<a href="#" data-act="edit" data-col="${c}" data-id="${esc(x.id)}">${esc(x.nome)}</a>` : esc(x.nome)} <span class="muted">— ${esc(x.papel)}</span></li>`).join('')}</ul>`).join('') : '<p class="muted">Ainda não vinculado a nenhum item.</p>'}</div>
    </div>
    <div class="m-foot"><span class="grow"></span><button class="btn" data-act="close">Fechar</button><button class="btn primary" data-act="edit" data-col="participantes" data-id="${esc(p.id)}">Editar cadastro</button></div>`;
  if (!modal.open) modal.showModal();

/* =====================================================================
   8. EXPORTAÇÃO / IMPORTAÇÃO
   ===================================================================== */
function download(name, content, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const today = () => new Date().toISOString().slice(0, 10);
function exportJson() { download(`projeto-fiorella-dados-${today()}.json`, JSON.stringify(S, null, 2), 'application/json'); toast('Backup exportado'); }
function exportCsv() {
  const cols = [['Processo', p => p.nome], ['Área', p => nome('areas', p.area)], ['Módulo', p => nome('modulos', p.modulo)],
    ['Responsável', p => (p.resp || []).map(tokName).join(', ')], ['Executor', p => (p.exec || []).map(tokName).join(', ')], ['Aprovador', p => (p.aprov || []).map(tokName).join(', ')],
    ['Consultado', p => (p.cons || []).map(tokName).join(', ')], ['Informado', p => (p.inf || []).map(tokName).join(', ')], ['Suplente', p => (p.sup || []).map(tokName).join(', ')],
    ['Prazo / SLA', p => p.prazo], ['Escalonamento', p => p.escal], ['Sistema / Integração', p => p.integ], ['Status', p => p.status], ['Etapa', p => p.etapa], ['Observações', p => p.obs]];
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = [cols.map(c => q(c[0])).join(';'), ...S.processos.map(p => cols.map(c => q(c[1](p))).join(';'))].join('\r\n');
  download(`processos-fiorella-${today()}.csv`, '﻿' + csv, 'text/csv;charset=utf-8'); toast('CSV exportado');
}
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.participantes) || !Array.isArray(d.processos)) throw new Error();
      if (!confirm('Substituir os dados deste navegador pelo arquivo importado?')) return;
      S = fillMissing(d); persist('Dados importados'); render(); renderTabs();
    } catch (err) { toast('Arquivo inválido'); }
  };
  r.readAsText(f); e.target.value = '';
});

/* =====================================================================
   9. EVENTOS
   ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, id = el.dataset.id, col = el.dataset.col;
  if (el.tagName === 'A') e.preventDefault();
  switch (a) {
    case 'tab': go(id); window.scrollTo({ top: 0 }); break;
    case 'new': openForm(col, null, col === 'processos' && ui.procArea && ui.procArea !== '*' ? { area: ui.procArea } : null); break;
    case 'edit': e.stopPropagation(); openForm(col, id); break;
    case 'person': e.stopPropagation(); showPerson(id); break;
    case 'close': modal.close(); break;
    case 'save': saveForm(); break;
    case 'del': deleteItem(); break;
    case 'pk-rm': form.draft[el.dataset.k].splice(+el.dataset.i, 1); drawPicker(el.dataset.k); break;
    case 'proc-area': ui.procArea = id; vProcessos(); break;
    case 'proc-view': ui.procView = id; vProcessos(); break;
    case 'proc-mod': ui.procMod = id; if (id) { ui.procArea = '*'; ui.procQ = ''; ui.procStatus = ''; } go('processos'); break;
    case 'task-filter': ui.taskFilter = id; vTarefas(); break;
    case 'task-proc': ui.taskProc = id; ui.taskFilter = id ? 'todas' : ui.taskFilter; go('tarefas'); break;
    case 'impl-kind': ui.implKind = id; vImplantacao(); break;
    case 'move': {
      const it = byId(col, id), i = ETAPA_NOMES.indexOf(it.etapa || 'Levantamento'), n = i + (+el.dataset.dir);
      if (n >= 0 && n < ETAPAS.length) { it.etapa = ETAPA_NOMES[n]; persist(`${it.nome} → ${it.etapa}`); vImplantacao(); }
      break;
    }
    case 'ideia-st': ui.ideiaStatus = id; vBacklog(); break;
    case 'adm-go': ui.admSec = id; go('adm'); break;
    case 'export-json': exportJson(); break;
    case 'export-csv': exportCsv(); break;
    case 'import-json': $('#importFile').click(); break;
    case 'reset': if (confirm('Restaurar os dados iniciais da planilha? As alterações deste navegador serão perdidas.')) { S = clone(SEED); try { localStorage.removeItem(LS_KEY); } catch (err) {} stamp(); render(); toast('Dados restaurados'); } break;
    case 'theme': {
      const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem(LS_KEY + '.theme', r.dataset.theme); } catch (err) {}
      break;
    }
  }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.ui; if (!k) return;
  ui[k] = e.target.value; (FILLS[ui.tab] || render)();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pkSel && t.value) { pkAdd(t.dataset.pkSel, t.value); }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.dataset && t.dataset.pkTxt && e.key === 'Enter') { e.preventDefault(); pkAdd(t.dataset.pkTxt, t.value); t.value = ''; }
});
modal.addEventListener('click', e => { if (e.target === modal) modal.close(); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== ui.tab) go(h); });

/* =====================================================================
   10. INÍCIO
   ===================================================================== */
try { const th = localStorage.getItem(LS_KEY + '.theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
stamp();
go(location.hash.slice(1) || 'visao');
</script>
</body>
</html>
